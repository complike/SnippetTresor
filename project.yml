name: SnippetTresor
options:
  bundleIdPrefix: de.complike
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Snippet-Tresor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  SnippetTresor:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.complike.SnippetTresor
        PRODUCT_NAME: Snippet-Tresor
        PRODUCT_MODULE_NAME: SnippetTresor
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Resources/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© COMPLIKE"
  SnippetTresorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SnippetTresor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.complike.SnippetTresorTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Snippet-Tresor.app/Contents/MacOS/Snippet-Tresor"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SnippetTresor:
    build:
      targets:
        SnippetTresor: all
        SnippetTresorTests: [test]
    test:
      config: Debug
      targets:
        - SnippetTresorTests
